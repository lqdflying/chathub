# Standalone MarkItDown sidecar. Run it next to ChatHub, then point ChatHub at
# it with MARKITDOWN_SERVICE_URL.
#
#   docker compose -f docker/markitdown/docker-compose.yml up -d --build
#
# If ChatHub already runs under Compose, copy the `markitdown` service into that
# file instead so both containers share a network, and use the service name in
# the URL (MARKITDOWN_SERVICE_URL=http://markitdown:5000).
services:
  markitdown:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set to "true" to add LLM-vision OCR for scanned PDFs and embedded images.
        INSTALL_OCR_PLUGIN: 'false'
    container_name: chathub-markitdown
    restart: always
    ports:
      # Bound to loopback: the service has no authentication unless
      # MARKITDOWN_API_KEY is set, and it converts whatever it is given.
      - '127.0.0.1:5000:5000'
    environment:
      - MARKITDOWN_API_KEY=${MARKITDOWN_API_KEY:-}
      - MARKITDOWN_MAX_FILE_SIZE=${MARKITDOWN_MAX_FILE_SIZE:-104857600}
      - MARKITDOWN_ENABLE_PLUGINS=${MARKITDOWN_ENABLE_PLUGINS:-false}
      - MARKITDOWN_KEEP_DATA_URIS=${MARKITDOWN_KEEP_DATA_URIS:-false}
      # Optional: caption images and OCR scanned pages via an OpenAI-compatible API.
      - MARKITDOWN_LLM_BASE_URL=${MARKITDOWN_LLM_BASE_URL:-}
      - MARKITDOWN_LLM_API_KEY=${MARKITDOWN_LLM_API_KEY:-}
      - MARKITDOWN_LLM_MODEL=${MARKITDOWN_LLM_MODEL:-}
      # Optional: Azure Document Intelligence / Content Understanding.
      - AZURE_DOC_INTEL_ENDPOINT=${AZURE_DOC_INTEL_ENDPOINT:-}
      - AZURE_CU_ENDPOINT=${AZURE_CU_ENDPOINT:-}
      - AZURE_API_KEY=${AZURE_API_KEY:-}
    # The converters need no inbound network of their own; egress is only used by
    # the optional YouTube/Azure/LLM paths.
    security_opt:
      - no-new-privileges:true
