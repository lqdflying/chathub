description: Test cumulative history compaction across languages and changed facts

providers:
  - openai:chat:gpt-5-mini

prompts:
  - file://promptfoo/history-summary/prompt.ts

tests:
  - vars:
      previousSummary: 'The service uses Node.js 20 and listens on port 3000. Deployment is unresolved.'
      messages:
        - role: 'user'
          content: 'We migrated to Bun 1.2 and changed the port to 3010. Deployment is complete.'
        - role: 'assistant'
          content: 'Confirmed: Bun 1.2, port 3010, and deployment completed.'
    assert:
      - type: llm-rubric
        provider: openai:gpt-5-mini
        value: 'The summary must retain Bun 1.2 and port 3010, mark deployment complete, and omit the superseded Node.js 20 and port 3000 facts.'
      - type: not-contains
        value: '<existing_summary>'

  - vars:
      previousSummary: '用户偏好简体中文；尚未决定数据库。'
      messages:
        - role: 'user'
          content: '数据库确定用 PostgreSQL，连接池上限设为 20。'
        - role: 'assistant'
          content: '已记录 PostgreSQL 和连接池上限 20。'
    assert:
      - type: llm-rubric
        provider: openai:gpt-5-mini
        value: "The output must remain in Simplified Chinese and preserve PostgreSQL, the pool limit of 20, and the user's language preference."

  - vars:
      previousSummary: 'El usuario prefiere respuestas breves. Falta elegir la fecha de lanzamiento.'
      messages:
        - role: 'user'
          content: 'El lanzamiento será el 15 de septiembre. Queda pendiente preparar las notas.'
        - role: 'assistant'
          content: 'Fecha confirmada; las notas siguen pendientes.'
    assert:
      - type: llm-rubric
        provider: openai:gpt-5-mini
        value: 'The output must be Spanish, retain the preference for brief answers and September 15 launch date, and identify release notes as unresolved.'

  - vars:
      previousSummary: 'ユーザーはTypeScriptを使用。認証方式は未決定。'
      messages:
        - role: 'user'
          content: '認証はOAuth 2.1に決定。PKCEを必須にしてください。'
        - role: 'assistant'
          content: 'OAuth 2.1と必須PKCEを記録しました。'
    assert:
      - type: llm-rubric
        provider: openai:gpt-5-mini
        value: 'The output must be Japanese and preserve TypeScript, OAuth 2.1, and the mandatory PKCE constraint.'
